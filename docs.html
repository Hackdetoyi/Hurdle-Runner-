<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hurdle Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scrolling when playing on touch devices */
        }

        .game-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Scanline effect for retro feel */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <!-- Game Container -->
    <div id="game-wrapper" class="relative w-full max-w-4xl bg-gray-800 rounded-xl overflow-hidden shadow-[0_0_40px_rgba(59,130,246,0.3)] ring-4 ring-gray-700">
        
        <!-- Score Display (In-game) -->
        <div id="score-display" class="absolute top-4 right-6 text-white game-font text-sm md:text-xl z-20 drop-shadow-md hidden">
            Score: <span id="current-score">0</span>
        </div>

        <!-- Canvas -->
        <div class="relative scanlines">
            <canvas id="gameCanvas" width="800" height="400" class="block w-full h-auto bg-gradient-to-b from-blue-300 to-blue-100"></canvas>
        </div>

        <!-- UI Overlays -->
        <div id="ui-layer" class="absolute inset-0 z-30 flex items-center justify-center bg-black/60 backdrop-blur-sm">
            
            <!-- Start Screen -->
            <div id="start-screen" class="text-center transform transition-all">
                <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 game-font mb-4 drop-shadow-lg">HURDLE<br><span class="text-2xl text-white mt-2 block">RUNNER</span></h1>
                <p id="hype-text" class="text-gray-300 mb-4 max-w-xs mx-auto min-h-[3rem] italic">Jump the hurdles. Don't trip. Get the highest score!</p>
                <button id="hype-btn" class="text-xs bg-purple-600 hover:bg-purple-500 text-white py-1 px-3 rounded mb-6 transition-colors border border-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.4)]">✨ Get Hyped</button>
                <div class="space-y-4 mb-8 text-sm text-gray-400">
                    <p class="flex items-center justify-center gap-2">
                        <kbd class="bg-gray-700 px-2 py-1 rounded text-white font-mono border border-gray-600">Space</kbd> / 
                        <kbd class="bg-gray-700 px-2 py-1 rounded text-white font-mono border border-gray-600">↑</kbd> to Jump
                    </p>
                    <p>or Tap/Click the screen</p>
                </div>
                <button id="start-btn" class="game-font px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded shadow-[0_4px_0_rgb(37,99,235)] hover:shadow-[0_2px_0_rgb(37,99,235)] hover:translate-y-[2px] transition-all active:shadow-none active:translate-y-[4px]">
                    START RACE
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="text-center hidden transform transition-all">
                <h2 class="text-4xl font-bold text-red-500 game-font mb-4 drop-shadow-lg">CRASH!</h2>
                <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8 shadow-xl inline-block">
                    <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Final Score</p>
                    <p id="final-score" class="text-5xl font-bold text-white game-font mb-4 text-emerald-400">0</p>
                    <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Best Score</p>
                    <p id="best-score" class="text-2xl font-bold text-yellow-400 game-font">0</p>
                </div>
                
                <div id="coach-feedback-box" class="max-w-md mx-auto mb-6 bg-blue-900/50 border border-blue-500/50 rounded-lg p-4 hidden">
                    <p class="text-blue-300 text-xs font-bold uppercase tracking-wider mb-2 text-left">Coach Says:</p>
                    <p id="coach-feedback-text" class="text-white text-sm italic text-left"></p>
                </div>

                <button id="coach-btn" class="mb-4 text-sm bg-purple-600 hover:bg-purple-500 text-white py-2 px-4 rounded transition-colors border border-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.5)]">
                    ✨ Coach's Analysis
                </button>
                <br>
                <button id="restart-btn" class="game-font px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded shadow-[0_4px_0_rgb(5,150,105)] hover:shadow-[0_2px_0_rgb(5,150,105)] hover:translate-y-[2px] transition-all active:shadow-none active:translate-y-[4px]">
                    PLAY AGAIN
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- GAME CONSTANTS & SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreDisplay = document.getElementById('score-display');
        const currentScoreEl = document.getElementById('current-score');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // New UI Elements for Gemini Features
        const hypeText = document.getElementById('hype-text');
        const hypeBtn = document.getElementById('hype-btn');
        const coachBtn = document.getElementById('coach-btn');
        const coachFeedbackBox = document.getElementById('coach-feedback-box');
        const coachFeedbackText = document.getElementById('coach-feedback-text');

        // Game Configuration
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 400;
        const GROUND_Y = 320; // Y position of the ground
        
        // State variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let bestScore = localStorage.getItem('hurdleBestScore') || 0;
        bestScoreEl.innerText = bestScore;
        let gameSpeed = 5;
        let frameCount = 0;
        let animationId;
        
        // Entities
        let player;
        let hurdles = [];
        let clouds = [];
        let particles = [];

        // --- CLASSES ---

        class Player {
            constructor() {
                this.width = 30;
                this.height = 60;
                this.x = 100;
                this.y = GROUND_Y - this.height;
                this.velocityY = 0;
                this.gravity = 0.6;
                this.jumpStrength = -12;
                this.isJumping = false;
                this.runFrame = 0; // For simple animation
            }

            jump() {
                if (!this.isJumping) {
                    this.velocityY = this.jumpStrength;
                    this.isJumping = true;
                    createDust(this.x + this.width / 2, GROUND_Y);
                }
            }

            update() {
                // Apply gravity
                this.velocityY += this.gravity;
                this.y += this.velocityY;

                // Ground collision
                if (this.y >= GROUND_Y - this.height) {
                    this.y = GROUND_Y - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // Animation frame logic (only animate when on ground)
                if (!this.isJumping) {
                    if (frameCount % 6 === 0) {
                        this.runFrame = (this.runFrame + 1) % 4; // 4 animation frames
                    }
                } else {
                    this.runFrame = 0; // Static frame while jumping
                }
            }

            draw() {
                ctx.save();
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                let shadowWidth = this.isJumping ? 20 : 30;
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2, GROUND_Y + 5, shadowWidth, 4, 0, 0, Math.PI*2);
                ctx.fill();

                // Character body (Track athlete)
                ctx.translate(this.x, this.y);
                
                // Head
                ctx.fillStyle = '#fcd34d'; // Skin tone
                ctx.beginPath();
                ctx.arc(this.width/2 + (this.isJumping ? 5 : 0), -10, 12, 0, Math.PI*2);
                ctx.fill();

                // Headband
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(this.width/2 - 12 + (this.isJumping ? 5 : 0), -16, 24, 6);

                // Body
                ctx.fillStyle = '#2563eb'; // Blue jersey
                ctx.fillRect(5, 2, 20, 25);
                
                // Shorts
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(5, 27, 20, 10);

                // Legs (animated)
                ctx.fillStyle = '#fcd34d';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';

                if (this.isJumping) {
                    // Jump pose
                    ctx.beginPath();
                    ctx.moveTo(10, 37); ctx.lineTo(0, 50); ctx.lineTo(15, 55); // Front leg bent
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(20, 37); ctx.lineTo(25, 60); // Back leg straight
                    ctx.stroke();
                } else {
                    // Running animation frames
                    if (this.runFrame === 0 || this.runFrame === 2) {
                        // Legs together-ish
                        ctx.beginPath(); ctx.moveTo(10, 37); ctx.lineTo(10, 60); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(20, 37); ctx.lineTo(20, 60); ctx.stroke();
                    } else if (this.runFrame === 1) {
                        // Stride wide
                        ctx.beginPath(); ctx.moveTo(10, 37); ctx.lineTo(-5, 55); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(20, 37); ctx.lineTo(35, 55); ctx.stroke();
                    } else {
                        // Stride alternate
                        ctx.beginPath(); ctx.moveTo(10, 37); ctx.lineTo(25, 55); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(20, 37); ctx.lineTo(5, 55); ctx.stroke();
                    }
                }

                // Arms
                ctx.strokeStyle = '#fcd34d';
                ctx.lineWidth = 5;
                if (this.isJumping) {
                    ctx.beginPath(); ctx.moveTo(15, 5); ctx.lineTo(30, -5); ctx.stroke(); // Arm up
                } else {
                    if (this.runFrame === 1) {
                        ctx.beginPath(); ctx.moveTo(15, 5); ctx.lineTo(35, 15); ctx.stroke();
                    } else if (this.runFrame === 3) {
                        ctx.beginPath(); ctx.moveTo(15, 5); ctx.lineTo(-5, 15); ctx.stroke();
                    } else {
                        ctx.beginPath(); ctx.moveTo(15, 5); ctx.lineTo(15, 25); ctx.stroke();
                    }
                }

                ctx.restore();
                
                // Debug Hitbox
                // ctx.strokeStyle = 'red';
                // ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Hurdle {
            constructor() {
                this.width = 15;
                this.height = 45; // Height of the hurdle
                this.x = GAME_WIDTH;
                this.y = GROUND_Y - this.height;
                this.passed = false; // Track if player jumped over it to add score
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Hurdle Stands (White/Metal)
                ctx.fillStyle = '#e5e7eb';
                ctx.fillRect(0, 0, 4, this.height);
                ctx.fillRect(this.width - 4, 0, 4, this.height);
                
                // Base feet
                ctx.fillRect(-5, this.height - 4, 14, 4);
                ctx.fillRect(this.width - 9, this.height - 4, 14, 4);

                // Top Bar (Red/White stripes)
                const barHeight = 10;
                ctx.fillStyle = '#ef4444'; // Red base
                ctx.fillRect(-2, 0, this.width + 4, barHeight);
                
                // White stripes
                ctx.fillStyle = 'white';
                for(let i=0; i<this.width+4; i+=8) {
                    ctx.fillRect(-2 + i, 0, 4, barHeight);
                }

                ctx.restore();
            }
        }

        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = Math.random() * 150 + 20;
                this.size = Math.random() * 30 + 20;
                this.speed = (Math.random() * 1 + 0.5) * (gameSpeed * 0.1); // Moves slower than ground
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, Math.PI * 0.5, Math.PI * 1.5);
                ctx.arc(this.x + this.size / 2, this.y - this.size / 2, this.size * 0.8, Math.PI * 1, Math.PI * 2);
                ctx.arc(this.x + this.size, this.y, this.size, Math.PI * 1.5, Math.PI * 0.5);
                ctx.closePath();
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 1) * 3;
                this.life = 1;
                this.decay = Math.random() * 0.05 + 0.02;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.fillStyle = `rgba(156, 163, 175, ${this.life})`; // Gray dust
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- HELPER FUNCTIONS ---

        const apiKey = "";

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function getGeminiResponse(prompt, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            
            try {
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No words.";
            } catch (error) {
                return "The API is currently taking a water break. Please try again later!";
            }
        }

        async function handleHypeClick() {
            hypeBtn.disabled = true;
            const originalText = hypeBtn.innerText;
            hypeBtn.innerText = "Consulting Coach...";
            hypeText.innerText = "Generating hype...";
            
            const prompt = "Write a 1-sentence over-the-top, funny pre-game hype speech to get a runner ready for a hurdle race.";
            const instruction = "You are a highly caffeinated track coach.";
            
            const response = await getGeminiResponse(prompt, instruction);
            hypeText.innerText = `"${response.replace(/"/g, '')}"`;
            
            hypeBtn.innerText = originalText;
            hypeBtn.disabled = false;
        }

        async function handleCoachAnalysis() {
            coachBtn.disabled = true;
            const originalText = coachBtn.innerText;
            coachBtn.innerText = "Analyzing footage...";
            coachFeedbackBox.classList.remove('hidden');
            coachFeedbackText.innerText = "Reviewing the tapes...";
            
            const prompt = `The player just crashed in a hurdle jumping game. Their final score was ${score}. Give them a 1-2 sentence funny, sarcastic, or overly-intense coach's critique based on how good or bad their score is. (A score below 500 is pretty bad, above 1500 is good).`;
            const instruction = "You are a tough, eccentric, and hilarious track and field coach. Address the player directly.";
            
            const response = await getGeminiResponse(prompt, instruction);
            coachFeedbackText.innerText = `"${response.replace(/"/g, '')}"`;
            
            coachBtn.innerText = originalText;
            coachBtn.disabled = false;
            coachBtn.classList.add('hidden'); // Hide after using once per game over screen
        }

        function createDust(x, y) {
            for(let i=0; i<5; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function drawBackground() {
            // Sky is handled by canvas CSS background
            
            // Draw Track/Ground
            
            // Back track line
            ctx.fillStyle = '#b91c1c'; // Dark red track
            ctx.fillRect(0, GROUND_Y - 20, GAME_WIDTH, 20);
            
            // Main running area
            ctx.fillStyle = '#dc2626'; // Bright red track
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

            // Track lane lines (scrolling)
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            const lineSpacing = 100;
            const lineOffset = -(frameCount * gameSpeed) % lineSpacing;
            
            for (let i = lineOffset; i < GAME_WIDTH; i += lineSpacing) {
                // Top lane lines
                ctx.fillRect(i, GROUND_Y - 5, 40, 2);
                // Bottom lane lines
                ctx.fillRect(i, GROUND_Y + 30, 40, 4);
            }
        }

        function checkCollision(player, hurdle) {
            // Simple AABB Collision with a slightly forgiving hitbox for the player
            const playerHitbox = {
                x: player.x + 10, // Inset hitbox slightly
                y: player.y + 10, // Ignore head
                width: player.width - 20,
                height: player.height - 15
            };

            const hurdleHitbox = {
                x: hurdle.x + 2,
                y: hurdle.y,
                width: hurdle.width - 4,
                height: hurdle.height
            };

            return (
                playerHitbox.x < hurdleHitbox.x + hurdleHitbox.width &&
                playerHitbox.x + playerHitbox.width > hurdleHitbox.x &&
                playerHitbox.y < hurdleHitbox.y + hurdleHitbox.height &&
                playerHitbox.y + playerHitbox.height > hurdleHitbox.y
            );
        }

        function spawnHurdle() {
            // Minimum distance between hurdles based on speed
            const minGap = 250 + (gameSpeed * 10); 
            const maxGap = 500 + (gameSpeed * 20);
            
            let shouldSpawn = true;
            
            if (hurdles.length > 0) {
                const lastHurdle = hurdles[hurdles.length - 1];
                const distance = GAME_WIDTH - lastHurdle.x;
                if (distance < minGap) {
                    shouldSpawn = false;
                }
            }

            // Random chance to spawn if gap is respected
            if (shouldSpawn && Math.random() < 0.02) {
                hurdles.push(new Hurdle());
            }
        }

        function spawnCloud() {
            if (clouds.length < 5 && Math.random() < 0.01) {
                clouds.push(new Cloud());
            }
        }

        // --- GAME LOOP ---

        function init() {
            player = new Player();
            hurdles = [];
            clouds = [];
            particles = [];
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            currentScoreEl.innerText = score;
            
            // Initial clouds
            for(let i=0; i<3; i++) {
                let c = new Cloud();
                c.x = Math.random() * GAME_WIDTH;
                clouds.push(c);
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            
            // Update Best Score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('hurdleBestScore', bestScore);
                bestScoreEl.innerText = bestScore;
            }
            
            finalScoreEl.innerText = score;
            
            // Reset Coach UI
            coachBtn.classList.remove('hidden');
            coachFeedbackBox.classList.add('hidden');
            coachFeedbackText.innerText = '';
            
            // Show UI
            uiLayer.classList.remove('hidden');
            gameOverScreen.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');

            // Screen shake effect on canvas wrapper
            const wrapper = document.getElementById('game-wrapper');
            wrapper.classList.add('animate-[shake_0.5s_ease-in-out]');
            setTimeout(() => wrapper.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
        }

        function animate() {
            if (gameState !== 'PLAYING') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            // Handle Clouds
            spawnCloud();
            clouds.forEach((cloud, index) => {
                cloud.update();
                cloud.draw();
                if (cloud.x + cloud.size * 2 < 0) {
                    clouds.splice(index, 1);
                }
            });

            // Handle Particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Handle Hurdles
            spawnHurdle();
            hurdles.forEach((hurdle, index) => {
                hurdle.update();
                hurdle.draw();

                // Check collision
                if (checkCollision(player, hurdle)) {
                    createDust(player.x + player.width/2, player.y + player.height/2);
                    gameOver();
                }

                // Score update
                if (!hurdle.passed && hurdle.x + hurdle.width < player.x) {
                    hurdle.passed = true;
                    score += 100;
                    currentScoreEl.innerText = score;
                    
                    // Increase speed slightly
                    if (gameSpeed < 15) {
                        gameSpeed += 0.2;
                    }
                }

                // Remove off-screen hurdles
                if (hurdle.x + hurdle.width < 0) {
                    hurdles.splice(index, 1);
                }
            });

            // Update & Draw Player
            player.update();
            player.draw();

            // Constant score increase based on distance/time
            if (frameCount % 10 === 0) {
                score += 1;
                currentScoreEl.innerText = score;
            }

            frameCount++;
            animationId = requestAnimationFrame(animate);
        }

        function startGame() {
            gameState = 'PLAYING';
            uiLayer.classList.add('hidden');
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            
            init();
            animate();
        }

        // --- INPUT HANDLING ---

        function handleInput(e) {
            // Prevent default scrolling for space/arrows
            if(e.type === 'keydown' && (e.code === 'Space' || e.code === 'ArrowUp')) {
                e.preventDefault();
            }

            if (gameState === 'PLAYING') {
                if (e.type === 'touchstart' || e.type === 'mousedown' || (e.type === 'keydown' && (e.code === 'Space' || e.code === 'ArrowUp'))) {
                    player.jump();
                }
            } else if (gameState === 'START' || gameState === 'GAMEOVER') {
                // Allow enter or space to start/restart
                if (e.type === 'keydown' && (e.code === 'Space' || e.code === 'Enter')) {
                    startGame();
                }
            }
        }

        // Event Listeners
        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('touchstart', handleInput, {passive: false});
        canvas.addEventListener('mousedown', handleInput);
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        hypeBtn.addEventListener('click', handleHypeClick);
        coachBtn.addEventListener('click', handleCoachAnalysis);

        // Add custom shake animation to Tailwind via JS style injection for the crash effect
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-1deg); }
                20%, 40%, 60%, 80% { transform: translateX(5px) rotate(1deg); }
            }
        `;
        document.head.appendChild(style);

        // Initial setup render (just to show background behind UI)
        init();
        drawBackground();
        player.draw();

    </script>
</body>
</html>
